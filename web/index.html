<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EmuPlay</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #0a0a10;
        overflow: hidden;
      }
      #root {
        display: flex;
      }
      /* Focus is drawn by FocusablePressable's own ring; the browser outline
         would double it up. */
      :focus {
        outline: none;
      }
      body.emuplay-cursor-hidden,
      body.emuplay-cursor-hidden * {
        cursor: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
